[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "mixtures"
requires-python = ">=3.10"
dependencies = [
    "django~=5.0",
    "dj-database-url~=3.1",
    "django-modeltranslation~=0.20",
    "django-simple-history~=3.11",
    "django-mistune~=0.3",
    "django-hosts~=6.0",  # TODO: Update to 7.0 when dj>=5.2
    "huey~=2.6",
    "md-anchors~=0.2",  # TODO: Remove this
    "whitenoise~=6.12",
    "gunicorn",
    "psycopg2-binary",
]

[tool.pdm.dev-dependencies]
dev = [
    "json-schema-for-humans",
    "ruff",
]

[tool.pdm.options]
add = ["--no-self"]
install = ["--no-self"]
remove = ["--no-self"]
update = ["--no-self"]

[tool.ruff]
extend-exclude = [
    "*/migrations/*.*",
    ".venv/*.*",
]
line-length = 79

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "C4", "DJ", "INP", "PIE", "PYI",
    "RSE", "RET", "SLOT", "SIM", "TID", "INT", "PTH", "PERF", "RUF"
]
ignore = [
    "DJ003",  # TODO: Remove this!
    "DJ012",
    "PERF203",  # TODO: Remove this on py>=3.11
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"mixtures/settings.py" = ["E501"]
"mixtures/settings_deploy.py"= ["F403", "F405"]
"drugcombinator/urls.py"= ["E501"]
"tests.py" = ["N802"]

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = false
