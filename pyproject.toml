[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "mixtures"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "django~=5.2",
    "dj-database-url~=3.1",
    "django-modeltranslation~=0.20",
    "django-simple-history~=3.11",
    "django-mistune~=0.3",
    "django-hosts~=7.0",
    "huey~=2.6",
    "mistune~=2.0",
    "whitenoise~=6.12",
    "gunicorn",
    "psycopg2-binary",
]

[tool.pdm.dev-dependencies]
dev = [
    "json-schema-for-humans",
    "ruff",
]

[tool.pdm.options]
add = ["--no-self"]
install = ["--no-self"]
remove = ["--no-self"]
update = ["--no-self"]

[tool.ruff]
extend-exclude = [
    "*/migrations/*.*",
    ".venv/*.*",
]
line-length = 79

[tool.ruff.lint]
select = [
    'ASYNC', 'B', 'BLE', 'C4', 'DJ', 'E', 'F', 'FLY', 'FURB', 'I', 'INP',
    'INT', 'LOG', 'N', 'PERF', 'PIE', 'PLE', 'PTH', 'PYI', 'RET', 'RSE', 'RUF',
    'SIM', 'SLOT', 'TID', 'UP', 'W', 'YTT'
]
ignore = [
    "DJ003",  # `locals()` as context to `render` functions
    "DJ012",  # Model definition order does not follow style guide
    "RUF012",  # Mutable default value for class attribute
]

[tool.ruff.lint.per-file-ignores]
"mixtures/settings.py" = ["E501"]
"mixtures/settings_deploy.py"= ["F403", "F405"]
"drugcombinator/urls.py"= ["E501"]
"tests.py" = ["N802"]

[tool.ruff.lint.isort]
lines-after-imports = 2
split-on-trailing-comma = false
